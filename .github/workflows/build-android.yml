name: build-android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Install Android platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;34.0.0"

      - name: Build release APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_ROOT"
          cargo apk build --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sallymc-arm64-test
          path: target/release/apk/*.apk
          if-no-files-found: error
